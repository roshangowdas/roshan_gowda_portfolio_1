<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#121212" />

  <!-- Top npm Navbar -->
  <rect width="1280" height="60" fill="#1e1e1e" border-bottom="1px solid #333333" />
  <!-- npm logo -->
  <rect x="30" y="15" width="60" height="30" fill="#cc3534" />
  <text x="38" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff">npm</text>

  <!-- Search bar -->
  <rect x="120" y="15" width="700" height="32" rx="4" fill="#2a2a2a" />
  <text x="140" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#888888">Search packages</text>
  <rect x="740" y="15" width="80" height="32" rx="4" fill="#505a69" />
  <text x="780" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Search</text>

  <!-- Top Right Avatar -->
  <circle cx="950" cy="30" r="16" fill="#2d3748" stroke="#4a5568" stroke-width="1.5" />
  <circle cx="950" cy="25" r="6" fill="#f6ad55" />
  <path d="M 942 38 C 942 32, 958 32, 958 38" fill="#319795" />

  <!-- Page Content Container -->
  <g transform="translate(40, 90)">
    <!-- Left Column: User Profile Card -->
    <g transform="translate(0, 0)">
      <!-- Avatar Image Box -->
      <rect x="0" y="0" width="200" height="230" rx="12" fill="#1a202c" stroke="#2d3748" stroke-width="2" />
      <!-- Stylized Vector Portrait of Roshan Gowda -->
      <rect x="5" y="5" width="190" height="220" rx="10" fill="#111827" />
      <!-- Hair & Face -->
      <path d="M 50 40 Q 100 15 150 40 Q 165 70 155 100 Q 100 130 45 100 Q 35 70 50 40 Z" fill="#1f2937" />
      <!-- Skin tone face -->
      <path d="M 60 70 Q 100 80 140 70 Q 145 110 135 140 Q 100 170 65 140 Q 55 110 60 70 Z" fill="#d97706" opacity="0.85" />
      <!-- Dark hair top -->
      <path d="M 40 50 Q 100 10 160 50 Q 140 30 100 25 Q 60 30 40 50 Z" fill="#0f172a" />
      <!-- Shirt/Shoulder -->
      <path d="M 20 220 C 20 170, 180 170, 180 220 Z" fill="#0f766e" />
      <!-- Hand pose accent -->
      <ellipse cx="100" cy="155" rx="12" ry="18" fill="#d97706" opacity="0.9" />

      <!-- User Name Info Below Avatar -->
      <text x="0" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="extrabold" fill="#ffffff">roshan__gowda</text>
      <text x="0" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9ca3af">Roshan Gowda S</text>

      <line x1="0" y1="320" x2="220" y2="320" stroke="#374151" stroke-width="1" />

      <!-- GitHub Handle -->
      <text x="30" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#9ca3af">@roshangowdas</text>
      <!-- GitHub Octocat Icon -->
      <circle cx="12" cy="344" r="8" fill="#9ca3af" />

      <line x1="0" y1="370" x2="220" y2="370" stroke="#374151" stroke-width="1" />

      <!-- Edit Profile Button -->
      <rect x="0" y="390" width="110" height="36" rx="6" fill="#262626" stroke="#404040" stroke-width="1" />
      <text x="55" y="413" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Edit Profile</text>
    </g>

    <!-- Right Column: npm Packages Dashboard -->
    <g transform="translate(280, 0)">
      <!-- Package / Organizations Tabs -->
      <rect x="0" y="0" width="380" height="45" rx="6" fill="#232136" border="1px solid #382c54" />
      <text x="30" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#a78bfa">📦  1 Package</text>

      <text x="220" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#22c55e">👥  0 Organizations</text>
      <line x1="0" y1="45" x2="900" y2="45" stroke="#374151" stroke-width="1.5" />

      <!-- Section Title & Add Package Button -->
      <g transform="translate(0, 70)">
        <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Package <tspan fill="#888888" font-size="20">1</tspan></text>

        <!-- Button -->
        <rect x="710" y="5" width="180" height="36" rx="6" fill="#262626" stroke="#404040" stroke-width="1" />
        <text x="800" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">+ Add Private Packages</text>
      </g>

      <!-- Package Item Card -->
      <g transform="translate(0, 140)">
        <!-- Package Name -->
        <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="extrabold" fill="#ffffff">@roshan__gowda/react-status-kit</text>

        <!-- Description -->
        <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9ca3af">A production-ready React component library for common UI states.</text>

        <!-- Published Info -->
        <text x="0" y="90" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#e5e7eb">roshan__gowda <tspan font-family="sans-serif" font-weight="normal" fill="#6b7280">published 1.0.0  •  6 days ago</tspan></text>

        <line x1="0" y1="120" x2="890" y2="120" stroke="#262626" stroke-width="1" />
      </g>
    </g>
  </g>
</svg>
